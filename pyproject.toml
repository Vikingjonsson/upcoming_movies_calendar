[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "upcoming-movies"
version = "0.1.0"
description = "Scrape upcoming movies from IMDB and export to multiple formats (ICS, JSON)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "icalendar>=5.0.7",
    "selenium>=4.10.0",
    "webdriver-manager>=3.9.1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.4.1",
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "types-icalendar>=6.3.1",
    "types-python-dateutil>=2.9.0",
    "types-pytz>=2025.2.0",
    "types-requests>=2.31.0",
]

[project.scripts]
upcoming-movies = "upcoming_movies.main:main"

[tool.setuptools.package-data]
upcoming_movies = ["py.typed"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "icalendar.*",
    "selenium.*",
    "webdriver_manager.*",
    "urllib3.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src"]
python_files = ["*_test.py", "test_*.py"]
filterwarnings = [
    "ignore::urllib3.exceptions.NotOpenSSLWarning",
]

[tool.pyright]
extraPaths = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "LOG",
]
ignore = [
    "DTZ007",
]


