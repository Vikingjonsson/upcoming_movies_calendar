[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "icalendar.*",
    "selenium.*",
    "webdriver_manager.*",
    "urllib3.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src"]
python_files = ["*_test.py", "test_*.py"]
filterwarnings = [
    "ignore::urllib3.exceptions.NotOpenSSLWarning",
]

[tool.pyright]
extraPaths = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "LOG",
]
ignore = [
    "DTZ007",
]


